spring:
  datasource:
    url: ${JDBC_URL:jdbc:sqlite:./data/workdsh-enterprise.sqlite}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql
workdsh:
