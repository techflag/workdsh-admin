<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkDSH · 企业用户登录</title><style>:root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--border:#e4e7ec}@media(prefers-color-scheme:dark){:root{--bg:#141517;--card:#202226;--text:#f2f4f7;--muted:#98a2b3;--border:#3a3d43}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 40px));padding:36px;background:var(--card);border:1px solid var(--border);border-radius:20px}strong{font-size:23px}strong span{color:#165dff}h1{font-size:26px;margin-top:36px}p{color:var(--muted);line-height:1.6}label{display:block;margin:20px 0 8px}input,button{width:100%;padding:13px;border-radius:9px;border:1px solid var(--border);font:inherit;background:var(--card);color:var(--text)}button{margin-top:24px;background:#165dff;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#error{color:#e5484d;min-height:20px}small{color:var(--muted)}</style><main><strong><span>W</span> WorkDSH</strong><h1>登录你的 AI 工作空间</h1><p>使用企业账号进入自己的会话、资料和技能。</p><form id="login"><label for="account">账号</label><input id="account" autocomplete="username" required placeholder="输入账号"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="输入密码"><button id="submit">登录并进入 DSH</button><p id="error" role="alert"></p></form><small>你的会话独立保存，主动分享的内容才对同事可见。</small></main><script src="/entry.js"></script></html>
